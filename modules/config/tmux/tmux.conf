# --- General Settings ---

# Setup
set -g default-terminal 'xterm-256color'
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set -s escape-time 0

# Remap prefix key
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Reload config file
bind r source-file $HOME/.config/tmux/tmux.conf \; display-message " 󰑓 Config reloaded"

# Functionality
set -g set-clipboard on
set -g mouse on
set -g status-interval 3
set -g detach-on-destroy off
set -g history-limit 50000
set -g display-time 2000

# --- Keybindings and Windows ---

# General settings
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Pane settings
# Split horizontal
unbind %
bind \\ split-window -h -f -c "#{pane_current_path}"

# Split vertical
unbind \"
bind - split-window -v -c "#{pane_current_path}"

# Window settings
# New Window
bind c new-window -c "#{pane_current_path}"

# Previou window
bind Tab last-window


# --- Additional Keybindings ---

# VIM motions
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Sesh
unbind s
bind-key s display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Session' tv sesh
unbind w
bind-key w display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Windows' tv tmux-windows 

bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
bind -N "last-session (via sesh) " L run-shell "sesh last"

# Lazygit
bind-key g display-popup -E -w 80% -h 80% -d '#{pane_current_path}' -T 'LazyGit' lazygit

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'omerxx/tmux-floax'

# Necessary run commands
source $HOME/.config/tmux/statusbar.conf
run "$HOME/.config/tmux/remote.tmux"
run "$HOME/.config/tmux/plugins/tpm/tpm"
